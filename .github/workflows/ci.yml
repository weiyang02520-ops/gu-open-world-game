name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test dependency
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Run Day 1~2 smoke
        run: python -m gu_game --scenario day1-2 --seed 20260925
      - name: Run M2 combat smoke
        run: python -m gu_game --scenario m2 --seed 20260925
      - name: Run M3 information smoke
        run: python -m gu_game --scenario m3 --seed 20260925
      - name: Run M4 faction smoke
        run: python -m gu_game --scenario m4 --seed 20260925
      - name: Run M5 economy smoke
        run: python -m gu_game --scenario m5 --seed 20260925

      - name: Run M6 cultivation smoke
        run: python -m gu_game --scenario m6 --seed 20260925
